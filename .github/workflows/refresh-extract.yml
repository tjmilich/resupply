# Rebuilds the bundled offline OpenStreetMap extract from Geofabrik once a month.
# Each region is downloaded, filtered to resupply's categories and deleted before the
# next, so the runner only ever holds one regional file (< 0.5 GB for the northeast set).
name: Refresh offline OSM extract

on:
  schedule:
    - cron: "17 6 3 * *"  # 06:17 UTC on the 3rd of each month
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-extract
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[extract,dev]"

      - name: Test
        run: pytest -q

      - name: Build extract
        run: resupply-extract northeast --work-dir "$RUNNER_TEMP/osm"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resupply/data/extract
          if git diff --cached --quiet; then
            echo "Extract unchanged."
          else
            date=$(python -c "import json;print(json.load(open('src/resupply/data/extract/manifest.json'))['osm_data_date'])")
            git commit -m "Refresh offline OSM extract (data from $date)"
            git push
          fi
